# Blueprint do Render: sobe a API + o front (Public/) no mesmo endereço.
# O repositório inteiro é clonado, então ../Public existe para o Express servir.
services:
  - type: web
    name: acolhesus
    runtime: node
    plan: free
    rootDir: Backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/saude
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false        # cole a connection string do Neon/Supabase no painel
      - key: JWT_SECRET
        generateValue: true
